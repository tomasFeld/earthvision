<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision</title>
    <link rel="stylesheet" href="coordenadas.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <aside class="menu-lateral">
        <div class="top-bar">
            <a href="hectareas.html">
                <button class="menu-button">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </a>
            <img src="logo2.png" alt="Logo" class="logo">
        </div>

        <div class="hectarea" id="hectarea-titulo">Hectarea 1</div>

        <div class="fertilidad">
            <span class="ferility-text" id="fertilidad-valor">Fertility: ...</span>
        </div>

        <div class="tabla-contenedor">
            <div class="tabla-fila">
                <div class="col-izquierda"><div class="caja-gris" id="dato-ndvi">NDVI: --</div></div>
                <div class="col-derecha"><div class="caja-gris" id="dato-ndmi">NDMI: --</div></div>
            </div>
            <div class="tabla-fila">
                <div class="col-izquierda"><div class="caja-gris" id="dato-temp">Temp: --</div></div>
                <div class="col-derecha"><div class="caja-gris" id="dato-prec">Lluvia: --</div></div>
            </div>
            <div class="tabla-fila">
                <div class="col-izquierda"><div class="caja-gris" id="dato-lat">Lat: --</div></div>
                <div class="col-derecha"><div class="caja-gris" id="dato-lng">Lng: --</div></div>
            </div>
            <div class="tabla-fila">
                <div class="col-izquierda"><div class="caja-gris" id="dato-nivel">Nivel: --</div></div>
                <div class="col-derecha"><div class="caja-gris" id="dato-fecha">--</div></div>
            </div>
        </div>
    </aside>

    <main class="hectareas-map">
        <div class="map-bar-verde">
            <span class="hectaera-map-text" id="mapa-titulo">Hectarea 1</span>
        </div>

        <div class="hectareas-buttonns">
            <button class="btn-map" id="btn-ver-clima">Weather</button>
            <button class="btn-map" id="btn-ver-analytics">Analytics</button>
        </div>

        <div id="mapa-campo"></div>
        <div id="mapa-fecha">Satelital (ArcGIS)</div>
    </main>

    <script src="coordenadas.js"></script>
</body>
</html>
