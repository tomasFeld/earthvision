<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision</title>
    <link rel="stylesheet" href="login.css">
    
    <!-- LEAFLET MAPS API (Gratuito y rápido) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js" defer></script>
    <script src="animation.js" defer></script>


    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>




  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  



</head>
<body>

    <div class="page-wrapper" id="pageWrapper">

        <span class="deco deco-top-left">Medicion</span>
        <span class="deco deco-top-right">Simplifican</span>
        
        <span class="deco deco-bottom-right">Eficiencia</span>

        <div class="intro-section" id="introSection">
            <h1 class="intro-title">
                <span class="intro-line intro-line-1">Soluciones que</span>
                <span class="intro-line intro-line-2">Simplifican</span>
            </h1>
            
        </div>

        <div class="login-container" id="loginCard">

            <div class="logo-box">
                <img src="logo2.png" alt="Field Vision" class="logo-img">
            </div>

            <div class="signup-row" id="signupRow">
                
                <button type="button" id="triggerSignup" class="signup-trigger-btn">Registrarse</button>
            </div>

            

            

            <input type="text" id="username" placeholder="E-Mail">
            <input type="password" id="password" placeholder="Password">

            <div class="extra-fields" id="extraFields">
                <input type="password" id="repeat-password" placeholder="Repeat-password">
                
                <!-- BOTON MAPA -->
                <button type="button" id="btn-open-map" class="btn-map-fluor">
                    
                    Seleccionar area en m²
                </button>
                


                

              
                <div class="text-option">

                    <span class="info-text-login"> Ya tenes una cuenta: </span>
                <span id="loginTab" class="login-text">Inicio sesion</span>
                </div>
                
            </div>

            

             <button type="button" id="btnLoginSubmit" class="signup-btn submit-login">Inciar Sesion</button>
            <button type="button" id="btnSignupSubmit" class="signup-btn submit-signup">Registrarse</button>

              
        </div>

    </div>

    <!-- MODAL MAPA -->
    <div id="map-modal" class="map-modal-overlay">
        <div class="map-card">
            <div class="map-card-header">
                <span>Haz clic en el mapa para obtener el área</span>
                <button type="button" id="btn-close-map" class="map-close-btn">&times;</button>
            </div>
            <div id="map-container">
               <div id="selected-coordinates">
    Todavía no seleccionaste ningún punto
</div>
            </div>
        </div>
    </div>

    <h3 id="response">...</h3>

</body>
</html>
