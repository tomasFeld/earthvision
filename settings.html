
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision - Configuración</title>

    <link rel="stylesheet" href="settings.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo2.png">
</head>

<body>

<div class="dashboard-container">

    <div class="panel-izquierdo">

        <div class="header-izquierdo">
            <div class="bloque-logo">
                <img src="logo2.png" alt="Earth Vision">
            </div>
        </div>

        <div class="contenido-panel">

            <div class="navbar">

                <a href="hectareas.html">
                    <button class="home-button">
                        <img src="homelogo.png" alt="Inicio">
                        <span class="texto-boton">Inicio</span>
                    </button>
                </a>

                <a href="analytics.html">
                    <button class="analytics-button">
                        <img src="analitycslogo.png" alt="Mercado">
                        <span class="texto-boton">Mercado</span>
                    </button>
                </a>

                <a href="weather.html">
                    <button class="weather-button">
                        <img src="weatherlogo.png" alt="Clima">
                        <span class="texto-boton">Clima</span>
                    </button>
                </a>

                <a href="settings.html">
                    <button class="setting-button">
                        <img src="settingslogo.png" alt="Configuración">
                        <span class="texto-boton">Configuración</span>
                    </button>
                </a>

            </div>
        </div>

        <div class="config-hover">

            <div class="buttons-config">

                <button class="perfil-button" id="abrir-usuario">
                    <span class="texto-boton">Usuario</span>
                    <img src="Img/flecha-correcta-3d-icon-png-download-4206421.png" alt="">
                </button>

                <button class="config-button" id="abrir-idioma">
                    <span class="texto-boton">Idioma</span>
                    <img src="Img/flecha-correcta-3d-icon-png-download-4206421.png" alt="">
                </button>

                <button class="config-button" id="abrir-modal">
                    <span class="texto-boton">Cerrar sesión</span>
                    <img src="Img/flecha-correcta-3d-icon-png-download-4206421.png" alt="">
                </button>

            </div>
        </div>

    </div>
</div>


<!-- VENTANA USUARIO -->

<div class="modal-overlay" id="modal-usuario">

    <div class="modal-sesion">

        <button class="cerrar-modal" data-cerrar="modal-usuario">×</button>

        <h2>Mi usuario</h2>
        <p>Información de tu cuenta</p>

        <div class="datos-cuenta">

            <label for="nombre-usuario">Nombre de usuario</label>
            <input type="text" id="nombre-usuario" placeholder="Tu nombre">

            <label for="email-usuario">Correo electrónico</label>
            <input type="email" id="email-usuario" readonly>

            <label for="password-usuario">Nueva contraseña</label>
            <input type="password" id="password-usuario"
                   placeholder="Dejar vacío para no cambiarla">

            <p id="mensaje-usuario"></p>

            <button class="boton-confirmar" id="guardar-usuario">
                Guardar cambios
            </button>

        </div>

    </div>
</div>


<!-- VENTANA IDIOMA -->

<div class="modal-overlay" id="modal-idioma">

    <div class="modal-sesion">

        <button class="cerrar-modal" data-cerrar="modal-idioma">×</button>

        <img src="Img/idioma.png" alt="Idioma">

        <h2>Idioma</h2>
        <p>Elegí el idioma de Earth Vision</p>

        <select id="seleccionar-idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
        </select>

        <button class="boton-confirmar" id="guardar-idioma">
            Guardar idioma
        </button>

    </div>
</div>


<!-- VENTANA CERRAR SESIÓN -->

<div class="modal-overlay" id="modal-cerrar-sesion">

    <div class="modal-sesion">

        <button class="cerrar-modal" id="cancelar-x">×</button>

        <h2>Cerrar sesión</h2>
        <p>¿Estás seguro de que querés cerrar sesión?</p>

        <div class="botones-modal">

            <button class="boton-cancelar" id="cancelar-sesion">
                Cancelar
            </button>

            <button class="boton-confirmar" id="confirmar-sesion">
                Cerrar sesión
            </button>

        </div>

    </div>
</div>


<script src="configuracion.js"></script>

</body>
</html>
