<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Vision</title>
    <link rel="stylesheet" href="analytics.css">
    <!-- En tu HTML <head> -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="analytics.js"></script>
    
</head>
<body>






<div class="dashboard-container">

    <div class="panel-izquierdo">
        <div class="header-izquierdo">
            <div class="bloque-logo">
              
              <img src="logo2.png" alt="">
            
            </div>
        </div>

        <div class="contenido-panel">

          <div class="navbar">
            <a href="hectareas.html">
              <button class="home-button">
                
                <img src="homelogo.png" alt="home-image" width="60px">
                <span class="texto-boton">Home</span>
                
                </button>
            </a>
            <a href="analytics.html">
              <button class="analytics-button">
                <img src="analitycslogo.png" alt="analizis-image" width="60px">
                <span class="texto-boton">Analytics</span>
                
              </button>
            </a>
            <a href="weather.html">
              <button>
                <img src="weatherlogo.png" alt="weather-image" width="60px">
                <span class="texto-boton">Weather</span>
                
              </button>
            </a>
            <a href="settings.html">
              <button>
                <img src="settingslogo.png" alt="settings-image" width="60px">
                <span class="texto-boton">Setting</span>
                
              </button>
            </a>
  
  
  
          </div>
  
          
        </div>


        
            

            
        </div>
     </div>
</div>




  <div class="analytics-hover">

    <div class="ingredients-buttons">

        <button class="Soja active" id="btn-soja">
            <span>Soja</span>
        </button>

        <button class="Maiz" id="btn-maiz">
            <span>Maiz</span>
        </button>

        <button class="Trigo" id="btn-trigo">
            <span>Trigo</span>
        </button>

        <button class="Girasol" id="btn-girasol">
            <span>Girasol</span>
        </button>
    </div>

    <div class="value-hover">
        <div class="mercado-dinero">
            <span class="mercado-etiqueta" id="mercado-titulo">Soja</span>
            <span class="mercado-precio" id="precio-ars">Cargando...</span>
            <span class="mercado-sub" id="precio-usd"></span>
            <span class="mercado-fecha" id="mercado-fecha"></span>
        </div>
    </div>

    <div class="increase-hover">
        <div class="mercado-incremento">
            <span class="mercado-etiqueta">Variación</span>
            <span class="mercado-precio" id="inc-valor">--</span>
            <span class="mercado-sub">vs. la rueda anterior</span>
            <span class="mercado-sub" id="inc-30d"></span>
            <span class="mercado-fuente">Fuente: granos.ar</span>
        </div>
    </div>

</div>


    
    
</body>
</html>
